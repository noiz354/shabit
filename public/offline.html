<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — HabitWealth</title>
  <meta name="theme-color" content="#0381FE" />
  <style>
    :root {
      --primary: #0381FE;
      --background: #FFFFFF;
      --surface: #F6F6F6;
      --on-background: #000000;
      --on-background-secondary: #666666;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #000000;
        --surface: #1A1A1A;
        --on-background: #FFFFFF;
        --on-background-secondary: #999999;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--background);
      color: var(--on-background);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .icon {
      width: 72px; height: 72px; background: var(--surface); border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; margin-bottom: 24px;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; color: var(--on-background-secondary); line-height: 1.5; max-width: 320px; }
    .actions { margin-top: 24px; display: flex; gap: 12px; }
    .btn {
      height: 48px; padding: 0 24px; border-radius: 18px; border: none;
      font-size: 14px; font-weight: 500; cursor: pointer;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: var(--surface); color: var(--on-background); }
  </style>
</head>
<body>
  <div class="icon" aria-hidden="true">◍</div>
  <h1>Kamu offline</h1>
  <p>Data terakhir tetap bisa dilihat. Perubahan yang kamu buat akan disimpan dan terkirim otomatis saat online.</p>
  <div class="actions">
    <button class="btn btn-secondary" onclick="history.back()">Kembali</button>
    <button class="btn btn-primary" onclick="location.reload()">Coba lagi</button>
  </div>
  <script>
    // If online, try to go back to app
    window.addEventListener('online', () => {
      // Try to reload main page if user came from offline fallback
      if (document.referrer) location.href = document.referrer;
      else location.href = './';
    });
  </script>
</body>
</html>
